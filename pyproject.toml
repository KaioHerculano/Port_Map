[project]
name = "port-map"
version = "0.1.0"
description = "A Django application to monitor IP addresses and ports using Celery."
authors = [{name = "Suporte"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=4.2",
    "celery[redis]>=5.3.6",
    "redis>=5.0.1",
    "python-dotenv>=1.0.1",
    "django-celery-beat>=2.5.0",
    "psycopg2-binary>=2.9.9",
    "gunicorn>=22.0.0",
    "whitenoise>=6.6.0",
    "xhtml2pdf (>=0.2.17,<0.3.0)",
    "pysnmp-lextudio (>=6.3.0,<7.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "coverage (>=7.14.3,<8.0.0)",
    "faker (>=40.27.0,<41.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "vulture (>=2.16,<3.0)"
]

[tool.coverage.run]
source = ["accounts", "monitor"]
omit = [
    "*migrations*",
    "*tests*",
]

[tool.coverage.report]
show_missing = true
